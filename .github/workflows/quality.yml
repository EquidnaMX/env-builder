name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Unit tests
        run: composer test
      - name: End-to-end tests
        run: composer test:e2e
      - name: Build PHAR
        run: composer build:phar
      - name: Verify PHAR environment overlays
        run: |
          php dist/env-builder.phar build --source=.test-e2e/.env.d --output=/tmp/env.dev --dev
          php dist/env-builder.phar build --source=.test-e2e/.env.d --output=/tmp/env.staging --staging
          grep -Fq 'ONLY_DEV=1' /tmp/env.dev
          grep -Fq 'ONLY_STAGING=1' /tmp/env.staging
